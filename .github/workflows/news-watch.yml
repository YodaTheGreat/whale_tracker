name: News Watch

on:
  workflow_dispatch: {}

jobs:
  news-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout whale_tracker
        uses: actions/checkout@v4

      - name: Checkout whale_tracker_data
        uses: actions/checkout@v4
        with:
          repository: YodaTheGreat/whale_tracker_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run news watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_watch.py

      - name: Commit and push state
        working-directory: data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news_state.json
          if [ -f news_config.json ]; then
            git add news_config.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git pull --rebase https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/YodaTheGreat/whale_tracker_data main
          git commit -m "Update news state"
          git push https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/YodaTheGreat/whale_tracker_data main
