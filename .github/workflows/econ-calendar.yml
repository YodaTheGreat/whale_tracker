name: Economic Calendar
on:
  workflow_dispatch: {}

concurrency:
  group: econ-calendar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: YodaTheGreat/whale_tracker_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run economic calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python econ_calendar.py
      - name: Commit updated state to data repo
        run: |
          cd data
          git config user.name "econ-calendar-bot"
          git config user.email "actions@github.com"
          if [ -f econ_state.json ]; then
            git add econ_state.json
            git diff --staged --quiet || git commit -m "update econ calendar state"
            git pull --rebase https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/YodaTheGreat/whale_tracker_data.git main
            git push https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/YodaTheGreat/whale_tracker_data.git HEAD:main
          else
            echo "econ_state.json ещё не создан (не было напоминаний) — коммитить нечего, это нормально."
          fi
