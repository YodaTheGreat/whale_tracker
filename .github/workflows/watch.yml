name: Whale Watch

on:
  schedule:
    # каждые 15 минут (UTC). GitHub может задержать запуск на пару минут
    # в пиковые нагрузки — это нормально для бесплатного тира.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # позволяет запускать вручную кнопкой в интерфейсе

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Восстанавливаем last_state.json из кэша между запусками,
      # чтобы скрипт помнил предыдущие балансы кошельков
      - uses: actions/cache@v4
        with:
          path: last_state.json
          key: whale-state-${{ github.run_id }}
          restore-keys: |
            whale-state-

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Commit updated state
        run: |
          git config user.name "whale-watch-bot"
          git config user.email "actions@github.com"
          git add last_state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
